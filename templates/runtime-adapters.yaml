schemaVersion: captain-runtime-adapters.v1
adapters:
  - runtimeId: codex
    ownerRegistryId: captain-codex
    instructionEntrypoint: AGENTS.md
    captainEligibility: dynamic
    defaultRole: captain
    swarmRole: orchestrator_and_integrator
    captainOsHooks:
      agentLaneLifecycle: supported
      nativeGoal: supported
      persistentLaneReuse: supported
      typedEvidence: supported
    launcher:
      transport: process_cli
      executable: codex
      receiptSchema: captain-worker-receipt.v1
      missingCapabilityBehavior: handoff
  - runtimeId: claude-code
    ownerRegistryId: captain-claude
    instructionEntrypoint: CLAUDE.md
    captainEligibility: dynamic
    defaultRole: captain_first
    swarmRole: standing_review_lane
    captainOsHooks:
      agentLaneLifecycle: supported
      nativeGoal: supported
      persistentLaneReuse: supported
      typedEvidence: supported
    launcher:
      transport: process_cli
      executable: claude
      receiptSchema: captain-worker-receipt.v1
      missingCapabilityBehavior: handoff
  - runtimeId: gemini-coding
    ownerRegistryId: captain-gemini
    instructionEntrypoint: GEMINI.md
    captainEligibility: crew_only
    defaultRole: read_only_judge
    swarmRole: optional_judge_or_packeted_lane
    captainOsHooks:
      agentLaneLifecycle: manual
      nativeGoal: manual
      persistentLaneReuse: manual
      typedEvidence: manual
    launcher:
      transport: host_native_receipt
      receiptSchema: captain-worker-receipt.v1
      missingCapabilityBehavior: handoff
